name: ESPN Projections & Player Stats Sync

# Projections: einmal taeglich (aendern sich selten/langsam).
# Player Stats (tatsaechliche Punkte): gleicher Rhythmus wie die
# Weekly-Scores-Sync (9 & 21 Uhr Berlin), da beides von Matchdays abhaengt.

on:
  schedule:
    - cron: "30 7 * * *"   # Projections + Stats, 09:30 Berlin (Sommer)
    - cron: "30 8 * * *"   # 09:30 Berlin (Winter)
    - cron: "30 19 * * *"  # 21:30 Berlin (Sommer)
    - cron: "30 20 * * *"  # 21:30 Berlin (Winter)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ESPN Projections Sync
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: node scripts/sync-espn-projections.js

      - name: ESPN Player Stats Sync
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: node scripts/sync-espn-player-stats.js

      - name: Commit & Push falls geändert
        run: |
          git config user.name "bear-witch-project-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/projections.js data/player-stats.js
          if git diff --cached --quiet; then
            echo "Keine Änderungen -- nichts zu committen."
            exit 0
          fi
          git commit -m "chore: ESPN projections & player stats sync"
          # Mehrere Sync-Workflows laufen zeitlich dicht beieinander und
          # committen unabhaengig voneinander -- der Push kann daher
          # gelegentlich abgelehnt werden, weil zwischenzeitlich ein
          # anderer Workflow schon gepusht hat (non-fast-forward). Da
          # jeder Workflow nur seine eigene(n) Datei(en) aendert, ist ein
          # Rebase auf den neuen Stand so gut wie nie konfliktbehaftet --
          # deshalb bei einem fehlgeschlagenen Push einfach den aktuellen
          # Stand holen, den eigenen Commit draufsetzen und erneut pushen.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $i/5) -- vermutlich hat ein anderer Sync-Workflow zeitgleich gepusht. Hole aktuellen Stand und versuche erneut..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 8 + 3))
          done
          echo "Push nach 5 Versuchen weiterhin fehlgeschlagen -- bitte Workflow-Log prüfen."
          exit 1
