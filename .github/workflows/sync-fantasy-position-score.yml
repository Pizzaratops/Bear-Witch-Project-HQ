name: Fantasy Power Score Sync

# Fantasy-Pendant zur Bootleg-Power-Score-Sync (Spinnennetz für die
# eigene 12-Team-Liga statt 32 NFL-Teams): Points Scored/Allowed +
# Points by QB/RB/WR/TE je Team, kumulativ und pro Woche isoliert.
#
# Braucht ESPN_S2/SWID wie die anderen ESPN-Syncs (privater Fantasy-
# Endpoint, nicht die oeffentliche Sport-API). Laeuft NACH dem
# Weekly-Scores-Sync (selber Zeitplan, 9 & 21 Uhr Berlin), damit
# data/weekly-scores.js schon aktuell ist, wenn dieses Script startet.
#
# Schreibt nichts, solange keine Woche gespielt ist -- Commit-Schritt
# greift dann einfach nicht.

on:
  schedule:
    - cron: "10 7 * * *"    # 09:10 Berlin (Sommerzeit) -- 10 Min nach Weekly-Scores-Sync
    - cron: "10 8 * * *"    # 09:10 Berlin (Winterzeit)
    - cron: "10 19 * * *"   # 21:10 Berlin (Sommerzeit)
    - cron: "10 20 * * *"   # 21:10 Berlin (Winterzeit)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fantasy Power Score Sync
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: node scripts/sync-fantasy-position-score.js

      - name: Commit & Push falls geändert
        run: |
          git config user.name "bear-witch-project-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fantasy-power-score.js
          if git diff --cached --quiet; then
            echo "Keine Änderungen -- nichts zu committen."
            exit 0
          fi
          git commit -m "chore: fantasy power score sync"
          # Mehrere Sync-Workflows laufen zeitlich dicht beieinander und
          # committen unabhaengig voneinander -- der Push kann daher
          # gelegentlich abgelehnt werden, weil zwischenzeitlich ein
          # anderer Workflow schon gepusht hat (non-fast-forward). Da
          # jeder Workflow nur seine eigene(n) Datei(en) aendert, ist ein
          # Rebase auf den neuen Stand so gut wie nie konfliktbehaftet --
          # deshalb bei einem fehlgeschlagenen Push einfach den aktuellen
          # Stand holen, den eigenen Commit draufsetzen und erneut pushen.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $i/5) -- vermutlich hat ein anderer Sync-Workflow zeitgleich gepusht. Hole aktuellen Stand und versuche erneut..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 8 + 3))
          done
          echo "Push nach 5 Versuchen weiterhin fehlgeschlagen -- bitte Workflow-Log prüfen."
          exit 1
