name: ESPN Roster Sync

# Synct die vollen Team-Roster aus ESPN Fantasy Football in
# data/rosters-live.js und committet die Aenderung ins Repo.
#
# Laeuft alle 3 Stunden + manuell startbar ("Run workflow" im Actions-Tab).
# Falls die Liga privat ist, muessen ESPN_S2 und SWID als Repository
# Secrets hinterlegt sein (Settings > Secrets and variables > Actions).

on:
  schedule:
    - cron: "0 */3 * * *"   # alle 3 Stunden, zur vollen Stunde (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ESPN Roster Sync
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: node scripts/sync-espn-rosters.js

      - name: Commit & Push falls geändert
        run: |
          git config user.name "bear-witch-project-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rosters-live.js
          if git diff --cached --quiet; then
            echo "Keine Änderungen -- nichts zu committen."
            exit 0
          fi
          git commit -m "chore: ESPN roster sync"
          # Mehrere Sync-Workflows laufen zeitlich dicht beieinander und
          # committen unabhaengig voneinander -- der Push kann daher
          # gelegentlich abgelehnt werden, weil zwischenzeitlich ein
          # anderer Workflow schon gepusht hat (non-fast-forward). Da
          # jeder Workflow nur seine eigene(n) Datei(en) aendert, ist ein
          # Rebase auf den neuen Stand so gut wie nie konfliktbehaftet --
          # deshalb bei einem fehlgeschlagenen Push einfach den aktuellen
          # Stand holen, den eigenen Commit draufsetzen und erneut pushen.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $i/5) -- vermutlich hat ein anderer Sync-Workflow zeitgleich gepusht. Hole aktuellen Stand und versuche erneut..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 8 + 3))
          done
          echo "Push nach 5 Versuchen weiterhin fehlgeschlagen -- bitte Workflow-Log prüfen."
          exit 1
