name: College Scouting Sync

# College Production Comp (WR, RB, TE, QB) + NFL Profile Comp fuer die
# College-Scouting-Erweiterung von Player DNA -- aus der
# CollegeFootballData.com API (CFBD) + nflverse (Draft-Historie, Combine).
# Drei Schritte, siehe claude/college-scouting-concept.md:
#   1. scripts/sync-college-scouting.js       -> data/college-scouting.js
#      (CFBD, braucht CFBD_API_KEY)
#   2. scripts/build-nfl-draft-athletic-profiles.js
#      -> data/nfl-draft-athletic-profiles.js (nflverse, KEIN CFBD-Key noetig)
#   3. scripts/build-nfl-profile-comp.js      -> data/nfl-profile-comp.js
#      (reine Offline-Verarbeitung der beiden vorigen Outputs, kein Netz)
#
# WICHTIG: braucht das Repository-Secret CFBD_API_KEY (Settings ->
# Secrets and variables -> Actions -> New repository secret, Name
# GENAU "CFBD_API_KEY"). Ohne das Secret bricht Schritt 1 sofort ab.
#
# Abgeschlossene College-Football-Jahrgaenge werden gecacht (aus der
# bestehenden data/college-scouting.js uebernommen) -- nur die laufende
# Saison wird pro Lauf neu geholt (6 API-Calls). Taeglich einmal reicht
# locker (CFB-Spiele sind i.d.R. samstags), bleibt weit unter dem
# 1.000-Calls/Monat-Free-Tier-Limit. Schritt 2 (nflverse) ist nicht
# CFBD-rate-limitiert -- laeuft taeglich mit, auch wenn sich die
# Draft-Historie kaum aendert (schadet nicht, haelt alles simpel/frisch).
#
# Taeglich 10 Uhr Berlin + manuell startbar.

on:
  schedule:
    - cron: "0 8 * * *"    # 10:00 Berlin (Sommerzeit)
    - cron: "0 9 * * *"    # 10:00 Berlin (Winterzeit)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: College Scouting Sync (CFBD)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: node scripts/sync-college-scouting.js

      - name: NFL Draft Athletic Profiles (nflverse, kein CFBD-Key)
        run: node scripts/build-nfl-draft-athletic-profiles.js

      - name: NFL Profile Comp (offline, verarbeitet obige zwei Outputs)
        run: node scripts/build-nfl-profile-comp.js

      - name: Commit & Push falls geändert
        run: |
          git config user.name "bear-witch-project-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/college-scouting.js data/nfl-draft-athletic-profiles.js data/nfl-profile-comp.js
          if git diff --cached --quiet; then
            echo "Keine Änderungen -- nichts zu committen."
            exit 0
          fi
          git commit -m "chore: college scouting sync"
          # Siehe sync-air-yards.yml fuer die Begruendung des Retry-Loops
          # (mehrere Sync-Workflows pushen zeitlich dicht beieinander).
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $i/5) -- vermutlich hat ein anderer Sync-Workflow zeitgleich gepusht. Hole aktuellen Stand und versuche erneut..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 8 + 3))
          done
          echo "Push nach 5 Versuchen weiterhin fehlgeschlagen -- bitte Workflow-Log prüfen."
          exit 1
